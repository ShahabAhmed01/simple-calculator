name: Bug report
description: Report a reproducible problem with the calculator
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove credentials, personal data, and
        other sensitive information from logs and screenshots before posting.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the exact buttons, keys, or expressions used.
      placeholder: |
        1. Run `python calculator_advanced.py`
        2. Select DEG
        3. Enter ...
        4. Click ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error message or a screenshot if helpful.
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.4"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11, Ubuntu 24.04, macOS 15"
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Where did the problem occur?
      options:
        - Desktop GUI
        - Command-line calculator
        - Tests or development tooling
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output (redacted)
      description: Paste only the part needed to understand the problem.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed secrets and personal data from this report.
          required: true
